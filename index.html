<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to the Office of the Administrative Rules Coordinator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <script>
      // ---- Nadia AI backend config ----
      // The site's own bundled chat widget calls `${RC}/api/chat`, patched to read
      // window.NADIA_API_BASE first. localhost/127.0.0.1 auto-uses the local Flask
      // backend (see nadia-backend/). On a deployed domain, set this to your
      // deployed backend's public URL, e.g.:
      // window.NADIA_API_BASE = 'https://your-oarc-nadia-backend.onrender.com';
      (function () {
        var isLocal = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
        window.NADIA_API_BASE = isLocal ? 'http://localhost:5051' : 'https://oarc-bk.onrender.com';
      })();
    </script>
    <script type="module" crossorigin src="assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Adds a direct "New chat" button to the AI panel header (the native
      // widget only offers this buried in the "Toggle chats" sidebar).
      // Clicking it opens the sidebar just long enough to trigger the real
      // New Chat action, then closes it again, so it behaves like a
      // one-click "clear chat" button matching the Winter Park site.
      (function () {
        function injectButton(headerLeft) {
          if (headerLeft.querySelector('[data-new-chat-quick]')) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'ai-icon-btn';
          btn.setAttribute('aria-label', 'Start new chat');
          btn.setAttribute('title', 'Start new chat');
          btn.setAttribute('data-new-chat-quick', '1');
          btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>';

          var header = headerLeft.closest('.ai-panel-header');
          var closeBtn = header ? header.querySelector('[aria-label="Close assistant"]') : null;
          if (closeBtn) {
            header.insertBefore(btn, closeBtn);
          } else {
            headerLeft.parentElement.appendChild(btn);
          }

          btn.addEventListener('click', function () {
            var panel = btn.closest('.ai-panel');
            var toggleBtn = panel.querySelector('[aria-label="Toggle chats"]');
            var sidebarWasOpen = !!panel.querySelector('.ai-sidebar');

            if (!sidebarWasOpen) toggleBtn.click();

            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                var newChatBtn = panel.querySelector('[aria-label="New chat"]');
                if (newChatBtn) newChatBtn.click();
                if (!sidebarWasOpen) {
                  requestAnimationFrame(function () { toggleBtn.click(); });
                }
              });
            });
          });
        }

        var observer = new MutationObserver(function () {
          var headerLeft = document.querySelector('.ai-panel-header-left');
          if (headerLeft) injectButton(headerLeft);
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
