<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to the Office of the Administrative Rules Coordinator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <script>
      // ---- Nadia AI backend config ----
      // The site's own bundled chat widget calls `${RC}/api/chat`, patched to read
      // window.NADIA_API_BASE first. localhost/127.0.0.1 auto-uses the local Flask
      // backend (see nadia-backend/). On a deployed domain, set this to your
      // deployed backend's public URL, e.g.:
      // window.NADIA_API_BASE = 'https://your-oarc-nadia-backend.onrender.com';
      (function () {
        var isLocal = ['localhost', '127.0.0.1'].indexOf(window.location.hostname) !== -1;
        window.NADIA_API_BASE = isLocal ? 'http://localhost:5051' : 'https://oarc-bk.onrender.com';
      })();
    </script>
    <script type="module" crossorigin src="assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <button
      type="button"
      id="quickNewChatBtn"
      class="ai-icon-btn"
      aria-label="Start new chat"
      title="Start new chat"
      style="display:none;position:fixed;z-index:10000;"
    ><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button>
    <script>
      // Adds a direct "New chat" button next to the AI panel's close button
      // (the native widget only offers this buried in the "Toggle chats"
      // sidebar). Implemented as an element OUTSIDE React's #root tree,
      // purely positioned over the header via getBoundingClientRect — never
      // inserted into the React-managed DOM, which previously caused an
      // infinite MutationObserver loop and froze the page.
      (function () {
        var btn = document.getElementById('quickNewChatBtn');
        var raf = null;

        function reposition() {
          var closeBtn = document.querySelector('.ai-panel [aria-label="Close assistant"]');
          if (!closeBtn) {
            btn.style.display = 'none';
            return;
          }
          var rect = closeBtn.getBoundingClientRect();
          btn.style.display = 'grid';
          btn.style.top = rect.top + 'px';
          btn.style.left = (rect.left - rect.width - 4) + 'px';
        }

        function loop() {
          reposition();
          raf = requestAnimationFrame(loop);
        }
        loop();

        btn.addEventListener('click', function () {
          var panel = document.querySelector('.ai-panel');
          if (!panel) return;
          var toggleBtn = panel.querySelector('[aria-label="Toggle chats"]');
          var sidebarWasOpen = !!panel.querySelector('.ai-sidebar');

          if (!sidebarWasOpen) toggleBtn.click();

          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              var newChatBtn = panel.querySelector('[aria-label="New chat"]');
              if (newChatBtn) newChatBtn.click();
              if (!sidebarWasOpen) {
                requestAnimationFrame(function () { toggleBtn.click(); });
              }
            });
          });
        });
      })();
    </script>
  </body>
</html>
